[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0-alpha.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sergeylikhotin/keyfill"
homepage = "https://github.com/sergeylikhotin/keyfill"
# Распространяется через npm (@keyfill/cli); крейты на crates.io не публикуются.
publish = false

[workspace.dependencies]
keyfill-core = { path = "crates/keyfill-core" }
keyfill-render = { path = "crates/keyfill-render" }
keyfill-js = { path = "crates/keyfill-js" }
taffy = "0.15"
parley = "0.12"
vello_cpu = "0.3"
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
anyhow = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
