# Сборка npm-пакетов keyfill под все платформы. Пакет бинаря собирается на своей платформе;
# @keyfill/core и @keyfill/cli одинаковы в каждом job (одинаковые .tgz сливаются при загрузке),
# каждый job проверяет установку всех трёх на своей ОС. На теге v* пакеты публикуются в npm
# (секрет NPM_TOKEN окружения npm с правом публикации в области @keyfill; публикация ждёт
# подтверждения в окружении).
#
# Локальная проверка того же пути — `node scripts/npm.mjs --smoke`. Сторонние actions
# закреплены по SHA коммита; версия — в комментарии.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64, binary: target/release/keyfill.exe }
          - { os: ubuntu-latest, target: linux-x64, binary: target/release/keyfill }
          - { os: macos-14, target: darwin-arm64, binary: target/release/keyfill }
          - { os: macos-13, target: darwin-x64, binary: target/release/keyfill }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Rust из rust-toolchain.toml
        run: rustup toolchain install
      - name: тег совпадает с версией
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs --check ${{ github.ref_name }}
      - name: fontconfig (шрифты системы для parley)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: npm ci
      - run: cargo build --release -p keyfill-cli
      - run: cargo test --workspace --release
      - run: npx tsc -p .
      - name: пакеты и проверка установки
        run: node scripts/npm.mjs --target ${{ matrix.target }} --binary ${{ matrix.binary }} --smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/*.tgz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Окружение npm: NPM_TOKEN — его секрет, публикация ждёт подтверждения владельца,
    # окружение доступно только тегам v*.
    environment: npm
    permissions:
      contents: read
      id-token: write  # npm provenance: пакет связан с этим workflow и коммитом
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/npm
          merge-multiple: true
      # Сначала пакеты бинарей и @keyfill/core, последним — @keyfill/cli, который на них ссылается.
      # Пререлиз (0.1.0-alpha.1) уходит под тегом next, обычная версия — под latest.
      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          node scripts/version.mjs --check ${{ github.ref_name }}
          tag=$(node scripts/version.mjs --dist-tag)
          for f in dist/npm/keyfill-cli-win32-*.tgz dist/npm/keyfill-cli-linux-*.tgz dist/npm/keyfill-cli-darwin-*.tgz dist/npm/keyfill-core-*.tgz; do npm publish "$f" --access public --tag "$tag" --provenance; done
          npm publish dist/npm/keyfill-cli-[0-9]*.tgz --access public --tag "$tag" --provenance
