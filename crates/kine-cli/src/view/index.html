<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kine view</title>
<style>
:root {
  --bg: #111317; --panel: #181b21; --line: #272c35; --text: #d8dde6; --muted: #8a93a3;
  --accent: #ff4d6d; --accent2: #3dd6a5; --chip: #222833;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header b { letter-spacing: .02em; }
header .tabs { display: flex; gap: 4px; }
header button, .controls button, .controls select { background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
header button.on { border-color: var(--accent); }
header .entry { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); display: inline-block; }
.dot.busy { background: #f5b84a; }
main { height: calc(100% - 51px); }
.view { display: none; height: 100%; }
.view.on { display: flex; }
#scene { gap: 0; }
.left { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; padding: 14px; gap: 10px; overflow: auto; }
.right { flex: 0 0 min(520px, 42%); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.checker { background-color: #3a3c42; background-image: linear-gradient(45deg, #2c2e34 25%, transparent 25%), linear-gradient(-45deg, #2c2e34 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #2c2e34 75%), linear-gradient(-45deg, transparent 75%, #2c2e34 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.box { position: absolute; display: none; border: 1px solid #4cc2ff; background: rgba(76, 194, 255, .10); }
.box.sel { border: 1.5px solid var(--accent); background: none; }
.box span { position: absolute; left: -1px; bottom: 100%; font: 11px/1.5 var(--mono); background: #4cc2ff; color: #06131c; padding: 0 5px; white-space: nowrap; border-radius: 3px 3px 0 0; }
.box.sel span { background: var(--accent); color: #fff; }
.box.flip span { bottom: auto; top: 100%; border-radius: 0 0 3px 3px; }
.error { display: none; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; color: #ffb3c0; background: #3a1820; border: 1px solid #6b2433; border-radius: 8px; padding: 10px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.controls .time { font-family: var(--mono); min-width: 190px; }
.timeline { position: relative; height: 70px; }
.timeline input { position: absolute; left: 0; right: 0; top: 0; width: 100%; margin: 0; accent-color: var(--accent); }
.marks { position: absolute; left: 8px; right: 8px; top: 24px; height: 44px; }
.mark { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; font-family: var(--mono); color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; cursor: pointer; white-space: nowrap; }
.mark.cue { top: 22px; color: var(--muted); border-style: dashed; }
.mark:hover { border-color: var(--accent); }
.subtabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
.subtabs button { background: none; color: var(--muted); border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
.subtabs button.on { color: var(--text); border-color: var(--line); background: var(--chip); }
pre { margin: 0; padding: 10px 12px; font: 12px/1.45 var(--mono); white-space: pre; overflow: auto; flex: 1; }
pre .node { cursor: pointer; }
pre .node:hover { background: #2a303b; }
pre .sel { background: #3a2230; }
#files { flex-direction: column; overflow: auto; padding: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.card .meta { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; font-size: 12px; }
.card .meta a { color: var(--text); text-decoration: none; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta span { color: var(--muted); white-space: nowrap; }
.card .body { min-height: 120px; display: flex; align-items: center; justify-content: center; }
.card img, .card video { display: block; max-width: 100%; max-height: 420px; }
.card iframe { width: 100%; height: 360px; border: 0; background: #fff; }
.card pre { max-height: 300px; width: 100%; }
.card .note { color: var(--muted); padding: 16px; font-size: 13px; }
.fresh { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { border-color: var(--accent2); } to { border-color: var(--line); } }
.empty { color: var(--muted); padding: 24px; }
@media (max-width: 900px) { #scene { flex-direction: column; } .right { flex-basis: auto; border-left: 0; border-top: 1px solid var(--line); height: 50%; } }
</style>
</head>
<body>
<header>
  <b>kine view</b>
  <div class="tabs">
    <button data-view="scene">Сцена</button>
    <button data-view="files">Файлы</button>
  </div>
  <span class="dot" id="busy" title="запрос"></span>
  <span class="entry" id="entry"></span>
</header>
<main>
  <section class="view" id="scene">
    <div class="left">
      <div class="error" id="error"></div>
      <div class="stage checker" id="stage"><canvas id="frame"></canvas><div class="overlay"><div class="box sel" id="selBox"><span></span></div><div class="box" id="hoverBox"><span></span></div></div></div>
      <div class="controls">
        <button id="play" title="Пробел">▶</button>
        <button id="prev" title="←">⏮</button>
        <button id="next" title="→">⏭</button>
        <span class="time" id="time">—</span>
        <select id="bg" title="подложка">
          <option value="">шахматка (альфа)</option>
          <option value="000000">чёрная</option>
          <option value="2b3340">серо-синяя</option>
          <option value="00b140">хромакей</option>
          <option value="ffffff">белая</option>
        </select>
        <select id="scale" title="качество кадра">
          <option value="0.5">½</option>
          <option value="1">1:1</option>
        </select>
      </div>
      <div class="timeline">
        <input type="range" id="slider" min="0" max="1" step="0.02" value="0">
        <div class="marks" id="marks"></div>
      </div>
    </div>
    <div class="right">
      <div class="subtabs">
        <button data-pane="dump" class="on">Дамп</button>
        <button data-pane="inspect">Inspect</button>
        <button data-pane="events">События</button>
      </div>
      <pre id="pane"></pre>
    </div>
  </section>
  <section class="view" id="files">
    <div class="grid" id="grid"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const S = { info: null, t: 0, fps: 50, playing: false, pane: 'dump', inspect: null, dump: [], version: null, want: null, files: '' };

const fmt = (t) => t.toFixed(2);
function frameOf(t) { return Math.round(t * S.fps); }

function setView(name) {
  document.querySelectorAll('header [data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === name));
  try { localStorage.setItem('kine.view', name); } catch {}
}
document.querySelectorAll('header [data-view]').forEach((b) => b.onclick = () => setView(b.dataset.view));

// ─── Сцена ─────────────────────────────────────────────────────────────────

async function loadInfo() {
  const info = await (await fetch('/api/scene')).json();
  if (info.scene === null) return null;
  S.info = info;
  $('entry').textContent = info.entry || '';
  $('error').style.display = info.error ? 'block' : 'none';
  $('error').textContent = info.error || '';
  if (info.error) return info;
  S.fps = info.fps;
  $('slider').max = info.end;
  $('slider').step = 1 / info.fps;
  $('stage').style.aspectRatio = `${info.size[0]} / ${info.size[1]}`;
  const marks = $('marks');
  marks.innerHTML = '';
  const pos = (t) => `${(t / Math.max(info.end, 1e-6)) * 100}%`;
  for (const m of info.markers) addMark(marks, m.name, m.t, pos, '');
  for (const c of info.cues) addMark(marks, c.cmd, c.t, pos, 'cue');
  addMark(marks, 'settled', info.settled, pos, 'cue');
  return info;
}

function addMark(root, name, t, pos, cls) {
  const el = document.createElement('span');
  el.className = `mark ${cls}`;
  el.style.left = pos(t);
  el.textContent = name;
  el.title = `${name} @ ${fmt(t)} с`;
  el.onclick = () => seek(t);
  root.appendChild(el);
}

function seek(t) {
  S.t = Math.max(0, Math.min(t, S.info?.end ?? t));
  $('slider').value = S.t;
  request();
}

// Конвейер кадров: до двух запросов в полёте, чтобы сервер не простаивал, пока браузер
// декодирует предыдущий кадр. Побеждает самый свежий момент: устаревшие ответы не рисуются.
const PIPELINE = 2;
let inflight = 0;
let seq = 0;
let drawn = 0;

function request() {
  S.want = S.t;
  pump();
}

async function pump() {
  if (S.want === null || inflight >= PIPELINE) return;
  const t = S.want;
  S.want = null;
  const my = ++seq;
  inflight++;
  $('busy').classList.add('busy');
  const bg = $('bg').value;
  const q = `t=${t}&s=${$('scale').value}${bg ? `&bg=${bg}` : ''}`;
  pump();
  try {
    const r = await fetch(`/api/frame.png?${q}&v=${S.version}`);
    if (!r.ok) throw new Error(await r.text());
    // Декодирование вне главного потока.
    const bmp = await createImageBitmap(await r.blob());
    if (my > drawn) {
      drawn = my;
      const canvas = $('frame');
      if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
        canvas.width = bmp.width;
        canvas.height = bmp.height;
      }
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bmp, 0, 0);
      $('stage').classList.toggle('checker', !bg);
      $('stage').style.background = bg ? `#${bg}` : '';
      $('time').textContent = `t=${fmt(frameOf(t) / S.fps)} с · кадр ${frameOf(t)}`;
      $('error').style.display = 'none';
    }
    bmp.close();
    // При воспроизведении — только кадры; дамп, рамки и inspect обновляются, когда стоим на последнем кадре.
    if (!S.playing && my === seq) {
      S.layout = await (await fetch(`/api/layout?t=${t}`)).json();
      showSelection();
      S.dump = (await (await fetch(`/api/dump?t=${t}`)).json()).lines;
      if (S.inspect) S.inspectText = await (await fetch(`/api/inspect?t=${t}&path=${encodeURIComponent(S.inspect)}`)).text();
      renderPane();
    }
  } catch (e) {
    $('error').style.display = 'block';
    $('error').textContent = String(e.message || e);
  }
  inflight--;
  if (!inflight) $('busy').classList.remove('busy');
  pump();
}

function renderPane() {
  const pane = $('pane');
  document.querySelectorAll('.subtabs button').forEach((b) => b.classList.toggle('on', b.dataset.pane === S.pane));
  if (S.pane === 'events') {
    const evs = (S.info?.events || []).map((e) => `${e.t <= S.t + 1e-9 ? '●' : '○'} ${e.label}`);
    pane.textContent = evs.length ? evs.join('\n') : 'событий нет';
    return;
  }
  if (S.pane === 'inspect') {
    pane.textContent = S.inspect ? (S.inspectText || '…') : 'кликни узел в кадре или в дампе';
    return;
  }
  pane.innerHTML = '';
  for (const { text, path } of S.dump || []) {
    const div = document.createElement('div');
    div.textContent = text || ' ';
    if (path) {
      div.className = 'node' + (path === S.inspect ? ' sel' : '');
      div.onclick = () => openInspect(path);
      div.onmouseenter = () => setHover(path);
      div.onmouseleave = () => setHover(null);
    }
    pane.appendChild(div);
  }
}

// ─── Рамки узлов ───────────────────────────────────────────────────────────

function boxOf(path) { return S.layout?.boxes.find((b) => b.path === path) || null; }

function place(el, b) {
  if (!b || !S.layout || S.playing) { el.style.display = 'none'; return; }
  const k = $('stage').clientWidth / S.layout.size[0];
  el.style.display = 'block';
  el.style.left = `${b.x * k}px`;
  el.style.top = `${b.y * k}px`;
  el.style.width = `${Math.max(b.w * k, 1)}px`;
  el.style.height = `${Math.max(b.h * k, 1)}px`;
  el.classList.toggle('flip', b.y * k < 18);
  el.querySelector('span').textContent = `${b.path} · ${b.kind} ${Math.round(b.w)}×${Math.round(b.h)}`;
}

function showSelection() {
  place($('selBox'), S.inspect ? boxOf(S.inspect) : null);
  if (S.hover) place($('hoverBox'), boxOf(S.hover));
}

/// Узел под точкой: последний в порядке отрисовки среди видимых, чья рамка её содержит.
function hitAt(e) {
  if (!S.layout) return null;
  const r = $('frame').getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * S.layout.size[0];
  const y = ((e.clientY - r.top) / r.height) * S.layout.size[1];
  for (let i = S.layout.boxes.length - 1; i >= 0; i--) {
    const b = S.layout.boxes[i];
    if (b.opacity > 0 && x >= b.x && y >= b.y && x <= b.x + b.w && y <= b.y + b.h) return b;
  }
  return null;
}

function setHover(path) {
  S.hover = path;
  place($('hoverBox'), path && path !== S.inspect ? boxOf(path) : null);
}

$('frame').onmousemove = (e) => setHover(hitAt(e)?.path || null);
$('frame').onmouseleave = () => setHover(null);
window.addEventListener('resize', showSelection);

async function openInspect(path) {
  S.inspect = path;
  setHover(null);
  showSelection();
  S.pane = 'inspect';
  S.inspectText = await (await fetch(`/api/inspect?t=${S.t}&path=${encodeURIComponent(path)}`)).text();
  renderPane();
}

document.querySelectorAll('.subtabs button').forEach((b) => b.onclick = () => { S.pane = b.dataset.pane; renderPane(); });

$('frame').onclick = async (e) => {
  if (!S.info) return;
  // Рамок может ещё не быть: кадр только что пришёл.
  if (!S.layout) S.layout = await (await fetch(`/api/layout?t=${S.t}`)).json();
  const path = hitAt(e)?.path;
  if (path) openInspect(path);
};

$('slider').oninput = () => { S.t = Number($('slider').value); stop(); request(); };
$('prev').onclick = () => { stop(); seek(S.t - 1 / S.fps); };
$('next').onclick = () => { stop(); seek(S.t + 1 / S.fps); };
$('bg').onchange = request;
$('scale').onchange = request;

// Воспроизведение в реальном времени: кадры запрашиваются так часто, как успевает сервер.
// Воспроизведение на rAF: время сцены идёт по метке кадра отрисовки, в скрытой вкладке
// цикл засыпает и не грузит сервер.
let last = 0;
function tick(now) {
  if (!S.playing) return;
  const dt = last ? (now - last) / 1000 : 0;
  last = now;
  S.t += dt;
  if (S.t > S.info.end) S.t = 0;
  $('slider').value = S.t;
  // Экран обновляется чаще, чем идут кадры сцены (144 Гц против 50): новый запрос — только на новый кадр.
  const f = frameOf(S.t);
  if (f !== S.playFrame) {
    S.playFrame = f;
    request();
  }
  requestAnimationFrame(tick);
}
function stop() {
  const was = S.playing;
  S.playing = false;
  $('play').textContent = '▶';
  if (was) request();
}
$('play').onclick = () => {
  if (!S.info || S.info.error) return;
  S.playing = !S.playing;
  $('play').textContent = S.playing ? '⏸' : '▶';
  last = 0;
  S.playFrame = null;
  // Рамки во время воспроизведения не обновляются — прячем, вернутся на паузе.
  setHover(null);
  showSelection();
  if (S.playing) requestAnimationFrame(tick);
  else request();
};

document.addEventListener('keydown', (e) => {
  if (!$('scene').classList.contains('on') || e.target.tagName === 'SELECT') return;
  const step = (e.shiftKey ? 10 : 1) / S.fps;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); stop(); seek(S.t - step); }
  if (e.code === 'ArrowRight') { e.preventDefault(); stop(); seek(S.t + step); }
});

// Правка исходников: отпечаток меняется, сцена и кадр перезагружаются.
async function watchScene() {
  try {
    const info = await (await fetch('/api/scene')).json();
    if (info.scene !== null && info.version !== S.version) {
      S.version = info.version;
      await loadInfo();
      if (S.t === 0 && S.info && !S.info.error) S.t = S.info.settled;
      $('slider').value = S.t;
      if (!S.info.error) request();
    }
  } catch {}
  setTimeout(watchScene, 1000);
}

// ─── Файлы ─────────────────────────────────────────────────────────────────

const size = (n) => n > 1e6 ? `${(n / 1e6).toFixed(1)} МБ` : n > 1e3 ? `${Math.round(n / 1e3)} КБ` : `${n} Б`;
const when = (ms) => new Date(ms).toLocaleTimeString('ru-RU');

async function watchFiles() {
  try {
    const list = await (await fetch('/api/files')).json();
    const key = JSON.stringify(list);
    if (key !== S.files) {
      const before = S.files ? JSON.parse(S.files) : [];
      S.files = key;
      renderFiles(list, before);
    }
  } catch {}
  setTimeout(watchFiles, 1500);
}

function renderFiles(list, before) {
  const grid = $('grid');
  grid.innerHTML = list.length ? '' : '<div class="empty">Каталог пуст. Всё, что kine пишет сюда (render, filmstrip, video), появится автоматически.</div>';
  const old = new Map(before.map((f) => [f.name, f.mtime]));
  for (const f of list) {
    const url = `/files/${encodeURIComponent(f.name)}?v=${f.mtime}`;
    const card = document.createElement('div');
    card.className = 'card' + (old.has(f.name) && old.get(f.name) === f.mtime ? '' : before.length ? ' fresh' : '');
    card.innerHTML = `<div class="meta"><a href="${url}" target="_blank"></a><span>${size(f.size)} · ${when(f.mtime)}</span></div><div class="body checker"></div>`;
    card.querySelector('a').textContent = f.name;
    const body = card.querySelector('.body');
    if (f.kind === 'image') {
      body.innerHTML = `<img src="${url}" alt="">`;
    } else if (f.kind === 'video') {
      body.innerHTML = `<video src="${url}" controls loop muted autoplay playsinline></video>`;
    } else if (f.kind === 'mov') {
      body.className = 'body';
      body.innerHTML = '<div class="note">ProRes и QuickTime в браузере не играют. Для просмотра: kine video … -o out/имя.webm</div>';
    } else if (f.kind === 'html') {
      body.className = 'body';
      body.innerHTML = `<iframe src="${url}" sandbox="allow-scripts"></iframe>`;
    } else if (f.kind === 'text') {
      body.className = 'body';
      const pre = document.createElement('pre');
      body.appendChild(pre);
      fetch(url).then((r) => r.text()).then((t) => { pre.textContent = t.length > 6000 ? t.slice(0, 6000) + '\n…' : t; });
    } else {
      body.className = 'body';
      body.innerHTML = '<div class="note">двоичный файл</div>';
    }
    grid.appendChild(card);
  }
}

// ─── Старт ─────────────────────────────────────────────────────────────────

(async () => {
  const info = await (await fetch('/api/scene')).json();
  let saved = null;
  try { saved = localStorage.getItem('kine.view'); } catch {}
  if (info.scene === null) {
    document.querySelector('[data-view="scene"]').style.display = 'none';
    setView('files');
  } else {
    setView(saved === 'files' ? 'files' : 'scene');
    watchScene();
  }
  watchFiles();
})();
</script>
</body>
</html>
